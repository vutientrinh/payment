spring.application.name=payment

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

payment.outbox.publisher.enabled=false
payment.outbox.publisher.fixed-delay=1s
payment.outbox.publisher.batch-size=50
payment.outbox.publisher.max-batches-per-run=10
payment.outbox.publisher.lease-duration=30s
payment.outbox.publisher.send-timeout=10s
payment.outbox.publisher.max-attempts=10
payment.outbox.publisher.initial-backoff=1s
payment.outbox.publisher.max-backoff=5m
