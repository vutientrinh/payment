spring.application.name=payment
payment.executor.enabled=${PAYMENT_EXECUTOR_ENABLED:false} 
payment.executor.consumer-group=${PAYMENT_EXECUTOR_CONSUMER_GROUP:payment-executor-v1}


# Kafka broker endpoint is deployment-specific. Do not commit credentials here.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.client-id=${KAFKA_CLIENT_ID:payment-outbox}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:5000}
# Must remain below payment.outbox.publisher.send-timeout to avoid application-level duplicate retries.
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:9000}
spring.kafka.producer.properties.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:250}


# Consumer offset is acknowledged only after successful execution.
spring.kafka.consumer.enable-auto-commit=false 
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer 
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer 
spring.kafka.listener.ack-mode=manual_immediate


# Keep publishing opt-in: API writes remain DB-backed if Kafka is unavailable or not configured.
payment.outbox.publisher.enabled=${KAFKA_OUTBOX_PUBLISHER_ENABLED:false}
payment.outbox.publisher.fixed-delay=1s
payment.outbox.publisher.batch-size=50
payment.outbox.publisher.max-batches-per-run=10
payment.outbox.publisher.lease-duration=30s
payment.outbox.publisher.send-timeout=10s
payment.outbox.publisher.max-attempts=10
payment.outbox.publisher.initial-backoff=1s
payment.outbox.publisher.max-backoff=5m
